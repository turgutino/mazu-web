name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mazu from GitHub main
        # Temporary, until Mazu 0.24.0 is published to PyPI: mazu-web's own
        # dependency floor (mazu[documents]>=0.24.0) can't be satisfied from
        # PyPI yet (only 0.23.0 is published there), and mazu-web's own code
        # already imports 0.24.0-only modules (document extraction, live model
        # discovery, reasoning-effort/vision capability signals). Installing
        # this first means pip's later dependency resolution for mazu-web finds
        # the constraint already satisfied instead of failing to resolve it.
        # Remove this step once Mazu 0.24.0 is on PyPI.
        run: pip install "mazu[documents] @ git+https://github.com/turgutino/Mazu.git@main"

      - name: Install mazu-web with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v
